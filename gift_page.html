<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift Page</title>
    <style>
        :root {
            --yes: #59E65EBE;
        }

        .image-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./photos/background_photo.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1; 
        }

        .centered-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .centered-container img {
            max-width: 80%; /* Устанавливаем максимальную ширину изображения в 80% от родительского контейнера */
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .emoji {
            font-size: 2rem;
            color: red;
            margin-top: 10px;
        }

        .beautiful-text {
            font-size: 24px;
            font-weight: bold;
            color: rgb(197, 81, 110);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); 
            padding: 10px 20px; 
            border: 2px solid rgb(182, 76, 111);
            border-radius: 10px; 
            background-color: rgba(255, 206, 223, 0.801);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-wrap: break-word; 
            max-width: 80%;
            margin: 0 auto; 
        }

        .yes-button {
            font-size: 1.5em;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            background-color: var(--yes);
            transition: transform 0.3s ease;
        }

        p.beautiful-text,
        h1.beautiful-text {
            margin-bottom: 20px;
        }
        .yes-button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="image-background"></div>
    <div class="container centered-container">
        <h1 class="beautiful-text">i have a silly gift for u, do u wanna take it?</h1>
        <button class="yes-button" id="accept-gift-btn">sí, porfi</button>
    </div>

    <script>
        const acceptBtn = document.getElementById('accept-gift-btn');

        acceptBtn.onclick = () => {
            document.querySelector('.centered-container').style.display = 'none';
            
            const photoContainer = document.createElement('div');
            photoContainer.className = 'centered-container';

            const img = document.createElement('img');
            img.src = './photos/photoamor.jpg';
            img.alt = 'gatitos';

            const emoji = document.createElement('span');
            emoji.className = 'emoji';
            emoji.textContent = '❤️';

            photoContainer.append(img, emoji);
            document.body.append(photoContainer);
        };
    </script>
</body>
</html>
