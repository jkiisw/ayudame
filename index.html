<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Silly Head</title>
    <style>
        :root {
            --bg: transparent; /* делаем фон прозрачным */
            --text: #fff;
            --yes: #59e65ebe;
            --no: #e25046c4;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            text-align: center;
            padding: 20px;
            position: relative; /* делаем родительским элементом для абсолютного позиционирования */
        }
        h1 {
            font-size: 2.5em;
            color: #f7ce60;
            margin: 0.2em 0 0.5em;
        }
        .buttons {
            margin-top: 10px;
            display: inline-flex; /* располагаем кнопки рядом */
            gap: 10px; /* промежуток между кнопками */
        }
        .yes-button, .no-button {
            font-size: 1.5em;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin: 0 6px;
        }
        .yes-button { 
            background-color: var(--yes); 
            transition: transform 0.3s ease; /* плавное изменение размера */
        }
        .no-button    { background-color: var(--no); }
        .gif_container {
            margin-top: 20px;
        }
        .gif_container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .yes-button.expanded {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 10vmax;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .no-button.hidden {
            visibility: hidden;
            pointer-events: none;
        }
        .beautiful-text {
            font-size: 24px;
            font-weight: bold;
            color: rgb(197, 81, 110);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); 
            padding: 10px 20px; 
            border: 2px solid rgb(182, 76, 111);
            border-radius: 10px; 
            background-color: rgba(255, 206, 223, 0.801);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-wrap: break-word; /* перенос длинных строк */
            max-width: 80%; /* ограничиваем ширину блока текстом */
            margin: 0 auto; /* горизонтальное выравнивание */
        }
        /* Класс для изображения на заднем фоне */
        .image-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('background_photo.jpg'); /* фон-изображение */
            background-size: cover;
            background-position: center;
            z-index: -1; /* изображение под всеми элементами */
        }
        /* Класс для видео на заднем фоне */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1; /* помещаем видео ниже остальных элементов */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif_container">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWNqcnJ4b3dqcjd1eHNvZmdueDlpNGlwdTM1ODM5cmo2MmhlazM4MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/vDhDcIEmShbUI/giphy.gif" alt="Cute GIF">
        </div>
        <h1 class="beautiful-text">What would you like to say?</h1>
        <div class="buttons">
            <button class="yes-button" onclick="handleYesClick()">Yes</button>
            <button class="no-button" onclick="handleNoClick()">No</button>
        </div>
    </div>

<!-- Динамически добавляем фон-изображение -->
<div class="image-background"></div>

<script>
    const mode = "local";
    const messages = [
        "Are you foreigner?",
        "I think you're a bit crazy if you click here...",
        "Hey, love, it's your last chance...",
        "Bro, come on, don't act autistically.",
        "Seriously? Do you want trouble?",
        "Last chance, honey...",
        "Alright, I won't ask again 💕",
        "Cabron!"
    ];
    let messageIndex = 0;

    function handleNoClick() {
        const noButton = document.querySelector('.no-button');
        const yesButton = document.querySelector('.yes-button');

        noButton.textContent = messages[messageIndex++];
        noButton.classList.add("animated-text");

        if (messageIndex < messages.length) {
            randomizePosition(noButton);
            adjustButtonSizes();
        } else {
            yesButton.classList.add('expanded');
            noButton.classList.add('hidden');
        }
    }

    function randomizePosition(button) {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        const x = Math.floor(Math.random() * (screenWidth - button.offsetWidth));
        const y = Math.floor(Math.random() * (screenHeight - button.offsetHeight));

        button.style.position = 'absolute';
        button.style.left = `${x}px`;
        button.style.top = `${y}px`;
    }

    function adjustButtonSizes() {
        const noButton = document.querySelector('.no-button');
        const yesButton = document.querySelector('.yes-button');

        const currentSizeNo = parseFloat(getComputedStyle(noButton).fontSize) || 16;
        const currentSizeYes = parseFloat(getComputedStyle(yesButton).fontSize) || 16;

        const step = 2;

        const newSizeNo = Math.max(currentSizeNo - step, 12);
        const newSizeYes = Math.min(currentSizeYes + 25, 700);

        noButton.style.fontSize = `${newSizeNo}px`;
        yesButton.style.fontSize = `${newSizeYes}px`;
    }

    function handleYesClick() {
        if (mode === "redirect") {
            window.location.href = "yes_page.html";
        } else {
            // Удаляем фон-изображение
            const imageBackground = document.querySelector('.image-background');
            imageBackground.parentNode.removeChild(imageBackground);

            // Добавляем видео на задний фон
            document.body.insertAdjacentHTML('beforeend', `
                <video class="video-background" autoplay muted loop playsinline>
                    <source src="lepestochki.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            `);

            document.querySelector('.container').innerHTML = `
                <h1 class="beautiful-text">Thank you for choosing to be mine! (Voluntarily) 💖</h1>
                <p class="beautiful-text">My darling, after spending so much time with you, I've realized that you're exactly the person I can and want to dedicate my life to.<br><br>
                I want to always be there for you whether you're happy or sad, whether life is easy or hard, whether you're full of energy or tired, whether you're achieving great things or making mistakes, whether you're beautifully dressed or simply at home.<br><br>
                I always want to stay by your side. It doesn't matter how well you'll do because you're already perfect for me. All those moments that seem like mistakes to you are, in my eyes, part of your journey, which I also want to share with you, supporting you through it.<br><br>
                I'm so proud of you, mi amor.<br><br>
                Today is Valentine's Day, one of those special days, so allow me to ask you, my love: Will you be my Valentine starting today and forever?<br></p>
            `;
        }
    }
</script>
</body>
</html>
