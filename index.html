<!DOCTYPE html>

<html lang="en">
<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>oa silly head</title>
      <style>
          :root {
              --bg: #5c5583;
              --text: #333;
              --yes: #59e65ebe;
              --no: #e25046c4;
          }
          * { box-sizing: border-box; }
          html, body {
              height: 100%;
              margin: 0;
              font-family: Arial, sans-serif;
              background-color: var(--bg);
              color: var(--text);
          }
          .container {
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 100%;
              text-align: center;
              padding: 20px;
          }
          h1 {
              font-size: 2.5em;
              color: #d32f2f;
              margin: 0.2em 0 0.5em;
          }
          .buttons {
              margin-top: 10px;
          }
          .yes-button, .no-button {
              font-size: 1.5em;
              padding: 12px 22px;
              border: none;
              border-radius: 8px;
              color: white;
              cursor: pointer;
              margin: 0 6px;
          }
          .yes-button { background-color: var(--yes); }
          .no-button    { background-color: var(--no); }
          .gif_container {
              margin-top: 20px;
          }
          .gif_container img {
              max-width: 100%;
              height: auto;
              border-radius: 10px;
          }
          .yes-button.expanded {
              position: fixed !important;
              top: 0;
              left: 0;
              right: 0;
              bottom: 0;
              font-size: 10vmax;
              z-index: 1000;
              display: flex;
              align-items: center;
              justify-content: center;
              text-transform: uppercase;
          }
          .no-button.hidden {
              visibility: hidden;
              pointer-events: none;
          }
      </style>
</head>
<body>
      <div class="container">
          <h1>what u will say?</h1>
          <div class="buttons">
              <button class="yes-button" onclick="handleYesClick()">Yes</button>
              <button class="no-button" onclick="handleNoClick()">No</button>
          </div>
          <div class="gif_container">
              <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaWNqcnJ4b3dqcjd1eHNvZmdueDlpNGlwdTM1ODM5cmo2MmhlazM4MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/vDhDcIEmShbUI/giphy.gif" alt="Cute GIF">
          </div>
      </div>
<script>
const mode = "local";
  const messages = [
        "re u fr??",
        "i think u re too much time cuz u pressed in here...",
        "re u kidding me o?",
        "bruh, c'mon, autistic",
        "think twice before saying that",
        "que?? do u wanna die?",
        "okay, i guess u just think that its funny",
        "vale, amor, last chance...",
        "alright, i wont ask again💕",
        "cabron"
    ];
let messageIndex = 0;

function handleNoClick() {
    const noButton = document.querySelector('.no-button');
    const yesButton = document.querySelector('.yes-button');

    noButton.textContent = messages[messageIndex++];

    if (messageIndex < messages.length) {

        randomizePosition(noButton);
        
        adjustButtonSizes();
    } else {
        yesButton.classList.add('expanded');
        noButton.classList.add('hidden');
    }
}

function randomizePosition(button) {
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    const x = Math.floor(Math.random() * (screenWidth - button.offsetWidth));
    const y = Math.floor(Math.random() * (screenHeight - button.offsetHeight));

    button.style.position = 'absolute';
    button.style.left = `${x}px`;
    button.style.top = `${y}px`;
}

function adjustButtonSizes() {
    const noButton = document.querySelector('.no-button');
    const yesButton = document.querySelector('.yes-button');

    const currentSizeNo = parseFloat(getComputedStyle(noButton).fontSize) || 16;
    const currentSizeYes = parseFloat(getComputedStyle(yesButton).fontSize) || 16;

    const step = 2;

    const newSizeNo = Math.max(currentSizeNo - step, 12);
    const newSizeYes = Math.min(currentSizeYes + 25, 700);

    noButton.style.fontSize = `${newSizeNo}px`;
    yesButton.style.fontSize = `${newSizeYes}px`;
}

function handleYesClick() {
    if (mode === "redirect") {
        window.location.href = "yes_page.html";
    } else {
        document.querySelector('.container').innerHTML = `
            <h1>Grax for choosing to be mine!💖</h1>
            <p>y ty for voluntarily
                accepting the invitation!!
                (voluntarily)</p>
        `;
    }
}
</script>

</body>
</html>
